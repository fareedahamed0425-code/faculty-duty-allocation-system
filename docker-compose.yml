version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apollo_faculty_scheduler_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./faculty_scheduler.db}
      - SECRET_KEY=${SECRET_KEY:-institution_scheduling_secret_jwt_key_2026_production_grade}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - MAX_WEEKLY_SUBSTITUTIONS=4
      - MAX_DAILY_REGULAR_CLASSES=2
      - INSTITUTION_NAME=The Apollo University
      - TIMEZONE=Asia/Kolkata
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_MODEL=nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      - BACKEND_CORS_ORIGINS=["http://localhost:3000", "http://localhost:8000", "http://localhost", "http://127.0.0.1:3000", "http://127.0.0.1:8000", "http://127.0.0.1"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apollo_faculty_scheduler_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
