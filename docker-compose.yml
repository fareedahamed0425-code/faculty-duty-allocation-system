version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: faculty_scheduler_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SECRET_KEY=institution_scheduling_secret_jwt_key_2026_production_grade
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - MAX_WEEKLY_SUBSTITUTIONS=4
      - MAX_DAILY_REGULAR_CLASSES=2
      - INSTITUTION_NAME=The Apollo University
      - TIMEZONE=Asia/Kolkata
      - DATABASE_URL=sqlite:///./faculty_scheduler.db
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_MODEL=nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
    volumes:
      - scheduler_data:/app
    restart: unless-stopped

volumes:
  scheduler_data:
